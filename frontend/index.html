<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aura Write - Lightweight text editor with real-time Gemini-powered inline autocomplete and writing assistant chatbot.">
    <title>Aura Write // Writing Assistant & Autocomplete</title>
    
    <!-- Google Fonts for premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- CSS Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Main Content Workspace (Full Screen Split Layout) -->
        <div class="workspace-wrapper">
            <!-- Left Side: Editor Section -->
            <main class="editor-section">
                <div class="editor-glass-card" id="editor-card">
                    <!-- Toolbar -->
                    <div class="editor-toolbar">
                        <div class="toolbar-left">
                            <!-- Clickable Markdown Toggle -->
                            <button class="toggle-badge" id="btn-toggle-markdown" title="Toggle Live Markdown Split Preview">
                                <span class="toggle-indicator"></span>
                                Markdown Preview
                            </button>
                            <!-- Clickable Model Switcher -->
                            <button class="toggle-badge model-active" id="btn-toggle-model" title="Click to switch models">
                                🤖 <span id="current-model-label">gemini-3.1-flash-lite</span>
                            </button>
                            
                            <!-- Premium Document Selector -->
                            <div class="document-selector-container">
                                <span class="doc-label">DOC:</span>
                                <select id="select-document" class="document-select" title="Switch between active documents">
                                    <option value="new">✦ New Document</option>
                                </select>
                            </div>
                        </div>
                        <div class="toolbar-right">
                            <button class="icon-btn" id="btn-clear" title="Clear text">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                            </button>
                            <button class="icon-btn" id="btn-copy" title="Copy to clipboard">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" /></svg>
                            </button>
                        </div>
                    </div>

                    <!-- Editor Content Panel -->
                    <div class="editor-workspace-split">
                        <!-- Left pane: Input & Autocomplete Overlay -->
                        <div class="editor-container" id="textarea-container">
                            <div class="editor-mirrored-backdrop" id="mirrored-backdrop"></div>
                            <textarea 
                                id="editor-textarea" 
                                placeholder="Start typing your story, exam structure, or document here... Pause typing to trigger autocomplete suggestions, or chat with the assistant on the right." 
                                spellcheck="false"
                                autocomplete="off"
                                autofocus
                            ></textarea>
                        </div>
                        
                        <!-- Right pane: Markdown Live Render Preview (Hidden by default, slides out when active) -->
                        <div class="editor-markdown-preview-pane" id="markdown-preview-pane">
                            <div class="markdown-header">Live Markdown Preview</div>
                            <div class="markdown-content" id="markdown-preview-content"></div>
                        </div>
                    </div>

                    <!-- Editor Footer -->
                    <div class="editor-footer">
                        <div class="footer-left">
                            <span class="stat-item"><strong id="word-count">0</strong> words</span>
                            <span class="stat-divider">|</span>
                            <span class="stat-item"><strong id="char-count">0</strong> characters</span>
                        </div>
                        <div class="footer-right">
                            <span class="tip"><span class="key">Tab</span> Accept</span>
                            <span class="stat-divider">|</span>
                            <span class="tip"><span class="key">Esc</span> Dismiss</span>
                        </div>
                    </div>
                </div>
            </main>

            <!-- Right Side: Sidebar Chatbot Section -->
            <aside class="chat-sidebar-section">
                <div class="chat-glass-card">
                    <!-- Document Structure & Context Panel -->
                    <div class="chat-context-panel" id="chat-context-panel">
                        <div class="context-panel-header">
                            <span class="context-panel-title">📋 Document Structure & Context</span>
                            <button class="context-clear-btn" id="btn-clear-context" title="Clear structure context">Clear</button>
                        </div>
                        <div class="context-panel-body" id="context-body">
                            No structure or context defined yet. Chat with Aura to outline or define what this document is about, and autocomplete will follow it.
                        </div>
                    </div>
                    
                    <!-- Chat Subheader Actions -->
                    <div class="chat-messages-header">
                        <span class="chat-messages-title">✦ Messages</span>
                        <button class="chat-reset-btn" id="btn-clear-chat" title="Reset chat history (keeps document context)">Reset Chat</button>
                    </div>
                    
                    <!-- Chat Message Area -->
                    <div class="chat-messages-container" id="chat-messages">
                    </div>

                    <!-- Chat Input Area -->
                    <div class="chat-input-wrapper">
                        <textarea 
                            id="chat-textarea" 
                            placeholder="Ask the assistant to draft, format, or restructure..."
                            rows="2"
                        ></textarea>
                        <button class="chat-send-btn" id="btn-send-chat" title="Send message">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>
                        </button>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <!-- JS Core Script -->
    <script src="app.js"></script>
</body>
</html>
